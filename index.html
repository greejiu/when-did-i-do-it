<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>그거 언제 했더라</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f5f5;
      color: #222;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(420px, calc(100% - 40px));
      padding: 32px;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 28px;
    }

    p {
      margin: 0;
      color: #666;
      line-height: 1.6;
    }

    #connection-status {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #eee;
      color: #444;
    }
  </style>
</head>
<body>
  <main>
    <h1>그거 언제 했더라</h1>
    <p>GitHub Pages 연결 완료</p>
    <p id="connection-status">Supabase 연결 확인 중...</p>
  </main>

  <script type="module">
    import { checkSupabaseConnection } from "./js/supabase.js";

    const status = document.querySelector("#connection-status");
    const connected = await checkSupabaseConnection();

    status.textContent = connected
      ? "Supabase 연결 성공 ✓"
      : "Supabase 연결 실패 — 설정을 다시 확인해 주세요.";
  </script>
</body>
</html>
