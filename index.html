<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>그거 언제 했더라</title>
  <link rel="stylesheet" href="./css/style.css?v=12" />
  <link rel="stylesheet" href="./css/history.css?v=4" />
  <link rel="stylesheet" href="./css/navigation.css?v=2" />
  <link rel="stylesheet" href="./css/item-card.css?v=4" />
  <link rel="stylesheet" href="./css/comfort-theme.css?v=4" />
  <link rel="stylesheet" href="./css/quick-add-modal.css?v=3" />
  <link rel="stylesheet" href="./css/subitems.css?v=2" />
  <link rel="stylesheet" href="./css/theme.css?v=1" />
</head>
<body>
  <main>
    <section id="auth-section" class="card">
      <h1>그거 언제 했더라</h1>
      <p class="description">내가 마지막으로 언제 했는지 기록해두는 곳</p>

      <form id="auth-form">
        <label>
          이메일
          <input id="email" type="email" autocomplete="email" required />
        </label>

        <label>
          비밀번호
          <input id="password" type="password" autocomplete="current-password" minlength="6" required />
        </label>

        <div class="actions">
          <button id="login-button" class="primary" type="submit">로그인</button>
          <button id="signup-button" class="secondary" type="button">회원가입</button>
        </div>
      </form>

      <p id="auth-message" class="message" aria-live="polite"></p>
    </section>

    <section id="app-section" class="card app-card hidden">
      <div class="app-header">
        <h1>그거 언제 했더라</h1>
      </div>

      <section id="home-view" class="app-view" data-app-view="home">
        <div class="section-heading">
          <h2>모든 항목</h2>
          <span id="item-status" class="muted">불러오는 중...</span>
        </div>

        <button id="item-add-toggle" class="primary add-item-button" type="button">+ 항목 추가</button>

        <form id="item-form" class="item-form hidden">
          <label>
            내용
            <input id="item-name" type="text" placeholder="예: 침구 세탁" maxlength="100" required />
          </label>

          <div class="form-row two-columns">
            <label>
              카테고리
              <select id="item-category" required></select>
            </label>

            <label>
              섹션 <span class="optional">(선택)</span>
              <select id="item-section"></select>
              <span class="helper">카테고리에 맞는 섹션만 보여줘.</span>
            </label>
          </div>

          <label>
            반복
            <select id="repeat-type">
              <option value="daily">매일</option>
              <option value="n_days">N일마다</option>
              <option value="weekly">매주</option>
              <option value="monthly">매월</option>
              <option value="custom">직접 간격 지정</option>
              <option value="date_only">다음 예정일만 직접 지정</option>
            </select>
          </label>

          <div class="form-row two-columns">
            <label id="repeat-number-group" class="hidden">
              <span id="repeat-number-label">반복 간격</span>
              <input id="repeat-number" type="number" min="1" step="1" value="2" />
            </label>

            <label id="repeat-unit-group" class="hidden">
              단위
              <select id="repeat-unit">
                <option value="day">일</option>
                <option value="week">주</option>
                <option value="month">개월</option>
              </select>
            </label>
          </div>

          <label>
            다음 예정일 직접 지정 <span class="optional">(선택)</span>
            <input id="next-due-override" type="date" />
            <span class="helper">입력하면 반복 주기보다 이 날짜를 우선 사용해.</span>
          </label>

          <div class="actions">
            <button id="item-save-button" class="primary" type="submit">저장</button>
            <button id="item-cancel-button" class="secondary" type="button">취소</button>
          </div>
          <p id="item-message" class="message" aria-live="polite"></p>
        </form>

        <div id="item-list" class="item-list" aria-live="polite"></div>
      </section>

      <section id="category-view" class="app-view hidden" data-app-view="category">
        <div class="section-heading">
          <h2>카테고리</h2>
          <div class="heading-tools">
            <span id="category-status" class="muted">불러오는 중...</span>
            <button id="taxonomy-toggle" class="secondary mini-button" type="button">관리</button>
          </div>
        </div>

        <div id="category-filter-list" class="category-filter-list" aria-label="카테고리 선택"></div>

        <div class="section-heading category-detail-heading">
          <strong>선택한 카테고리</strong>
          <span id="category-item-status" class="muted"></span>
        </div>
        <div id="category-item-list" class="item-list" aria-live="polite"></div>
      </section>

      <section id="records-view" class="app-view hidden" data-app-view="records">
        <div class="section-heading">
          <h2>기록</h2>
          <span id="global-record-status" class="muted">불러오는 중...</span>
        </div>
        <p class="helper records-intro">항목을 선택하면 미니 달력과 지난 완료 기록을 볼 수 있어요.</p>
        <div id="global-record-list" class="global-record-list" aria-live="polite"></div>
      </section>

      <section id="settings-view" class="app-view hidden" data-app-view="settings">
        <div class="section-heading">
          <h2>설정</h2>
        </div>

        <div class="settings-block">
          <div class="settings-block-heading">
            <div>
              <h3>계정</h3>
              <p class="helper">현재 로그인한 계정이에요.</p>
            </div>
          </div>
          <div class="settings-account-row">
            <p class="account-email" id="account-email"></p>
            <button id="logout-button" class="secondary compact" type="button">로그아웃</button>
          </div>
        </div>

        <div class="settings-block">
          <div class="settings-block-heading">
            <div>
              <h3>표시·정렬</h3>
              <p class="helper">항목이 어떤 순서로 보일지 선택할 수 있어요.</p>
            </div>
          </div>
        </div>
      </section>

      <nav id="bottom-nav" class="bottom-nav" aria-label="하단 메뉴">
        <button class="bottom-nav-button is-active" type="button" data-nav-view="home" aria-current="page">
          <span class="bottom-nav-icon" aria-hidden="true">⌂</span>
          <span>홈</span>
        </button>
        <button class="bottom-nav-button" type="button" data-nav-view="category">
          <span class="bottom-nav-icon" aria-hidden="true">▦</span>
          <span>카테고리</span>
        </button>
        <button class="bottom-nav-button" type="button" data-nav-view="records">
          <span class="bottom-nav-icon" aria-hidden="true">◷</span>
          <span>기록</span>
        </button>
        <button class="bottom-nav-button" type="button" data-nav-view="settings">
          <span class="bottom-nav-icon" aria-hidden="true">⚙</span>
          <span>설정</span>
        </button>
      </nav>
    </section>
  </main>

  <dialog id="taxonomy-modal" class="taxonomy-modal" aria-labelledby="taxonomy-modal-title">
    <div class="taxonomy-modal-shell">
      <div class="taxonomy-modal-header">
        <button id="taxonomy-back" class="secondary taxonomy-back hidden" type="button">←</button>
        <div class="taxonomy-modal-title-area">
          <h2 id="taxonomy-modal-title">카테고리 관리</h2>
          <p id="taxonomy-modal-subtitle" class="muted">이모지는 카테고리 이름에 직접 입력할 수 있어요.</p>
        </div>
        <button id="taxonomy-close" class="secondary taxonomy-close" type="button" aria-label="닫기">×</button>
      </div>

      <div id="taxonomy-category-view" class="taxonomy-modal-content">
        <section class="taxonomy-block">
          <div class="taxonomy-heading">
            <h3>카테고리</h3>
            <button id="taxonomy-add-category" class="secondary mini-button" type="button">+ 카테고리</button>
          </div>
          <div id="taxonomy-category-list" class="taxonomy-list"></div>
        </section>
      </div>

      <div id="taxonomy-section-view" class="taxonomy-modal-content hidden">
        <section class="taxonomy-block">
          <div class="taxonomy-heading">
            <h3 id="taxonomy-section-title">섹션</h3>
            <button id="taxonomy-add-section" class="secondary mini-button" type="button">+ 섹션</button>
          </div>
          <div id="taxonomy-section-list" class="taxonomy-list"></div>
        </section>
      </div>

      <p id="taxonomy-message" class="message" aria-live="polite"></p>
    </div>
  </dialog>

  <dialog id="history-modal" class="history-modal" aria-labelledby="history-title">
    <div class="history-modal-shell">
      <div class="history-modal-header">
        <div>
          <h2 id="history-title">완료 기록</h2>
          <p id="history-subtitle" class="muted"></p>
        </div>
        <button id="history-close" class="secondary history-close" type="button" aria-label="닫기">×</button>
      </div>

      <section class="history-calendar-card">
        <div class="history-calendar-toolbar">
          <button id="history-prev-month" class="secondary history-month-button" type="button" aria-label="이전 달">‹</button>
          <strong id="history-month-label"></strong>
          <button id="history-next-month" class="secondary history-month-button" type="button" aria-label="다음 달">›</button>
        </div>

        <div class="history-weekdays" aria-hidden="true">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div id="history-calendar-grid" class="history-calendar-grid"></div>

        <form id="history-add-form" class="history-add-form">
          <label>
            완료 날짜
            <input id="history-date" type="date" required />
          </label>
          <button id="history-add-button" class="primary history-add-button" type="submit">+ 기록 추가</button>
        </form>
        <p id="history-message" class="message" aria-live="polite"></p>
      </section>

      <section class="history-record-card">
        <div class="history-record-heading">
          <h3>완료 기록</h3>
          <span id="history-record-count" class="muted"></span>
        </div>
        <div id="history-record-list" class="history-record-list" aria-live="polite"></div>
      </section>
    </div>
  </dialog>

  <script type="module" src="./js/main.js?v=2"></script>
</body>
</html>
