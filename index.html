<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>그거 언제 했더라</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <main>
    <section id="auth-section" class="card">
      <h1>그거 언제 했더라</h1>
      <p class="description">내가 마지막으로 언제 했는지 기록해두는 곳</p>

      <form id="auth-form">
        <label>
          이메일
          <input id="email" type="email" autocomplete="email" required />
        </label>

        <label>
          비밀번호
          <input id="password" type="password" autocomplete="current-password" minlength="6" required />
        </label>

        <div class="actions">
          <button id="login-button" class="primary" type="submit">로그인</button>
          <button id="signup-button" class="secondary" type="button">회원가입</button>
        </div>
      </form>

      <p id="auth-message" class="message" aria-live="polite"></p>
    </section>

    <section id="app-section" class="card app-card hidden">
      <div>
        <h1>그거 언제 했더라</h1>
        <p>로그인 성공 ✓</p>
      </div>

      <div>
        <p class="account-email" id="account-email"></p>
        <p>다음 단계에서 관리 항목을 추가할 수 있게 만들 거야.</p>
      </div>

      <button id="logout-button" class="secondary" type="button">로그아웃</button>
    </section>
  </main>

  <script type="module" src="./js/auth.js"></script>
</body>
</html>
